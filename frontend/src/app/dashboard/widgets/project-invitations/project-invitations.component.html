<section class="widget" aria-labelledby="invitations-heading">
  <h2 id="invitations-heading">Projektmeghívások</h2>
  <div class="widget-row invitation-row">
    <span class="widget-thumbnail thumb-product" aria-hidden="true"></span>
    <div>
      <h3>{{ invitation.title }}</h3>
      <p class="widget-secondary">{{ invitation.description }}</p>
      <details class="widget-details">
        <summary>Meghívás részletei</summary>
        <p class="widget-secondary">{{ invitation.details }}</p>
      </details>
    </div>
  </div>
</section>
